      <stop offset="0.59" stop-color="#071c56"/>
      <stop offset="1" stop-color="#03102e"/>
    </radialGradient>
    <linearGradient id="swooshGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26dda8"/>
      <stop offset="0.55" stop-color="#6bed48"/>
      <stop offset="1" stop-color="#d6f346"/>
    </linearGradient>
