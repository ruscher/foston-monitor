  <title id="title">FOSTONOS</title>
  <desc id="desc">Logotipo vetorial FOSTONOS. Ícone azul-marinho de cantos arredondados, símbolo orbital FOSTON em verde, vermelho e violeta; FOSTON branco e OS branco em negrito.</desc>
