      <stop offset="0.48" stop-color="#fd4542"/>
      <stop offset="0.82" stop-color="#ff831f"/>
      <stop offset="1" stop-color="#ffc02e"/>
    </linearGradient>
    <radialGradient id="sphere" cx="62%" cy="24%" r="75%">
