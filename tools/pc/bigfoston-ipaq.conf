# /etc/modprobe.d/bigfoston-ipaq.conf — no PC que fala com o FOSTON.
# O driver ipaq (porta serial do agente no Windows CE, 045e:00ce) tenta abrir
# a porta até connect_retries vezes, 1 s cada (padrão 100). Se algum programa
# abre /dev/ttyUSB0 no instante em que o FOSTON salta para o Linux, o PC fica
# até 100 s sem enumerar o gadget USB do Linux (medido em 2026-11-20).
options ipaq connect_retries=3
